name: Here
options:
  bundleIdPrefix: com.hereur
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.6
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  Here:
    type: application
    platform: iOS
    sources:
      - path: Here
        excludes: ["Config.example.plist"]
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hereur.here.dev
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Here Dev
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
  HereTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HereTests]
    dependencies:
      - target: Here
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Here:
    build:
      targets:
        Here: all
    test:
      targets: [HereTests]
  Here Preview:
    build:
      targets:
        Here: all
    run:
      config: Debug
      commandLineArguments:
        "--preview": true
