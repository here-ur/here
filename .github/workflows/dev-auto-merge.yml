# dev로 가는 PR에 자동 머지를 켠다.
# 룰셋 조건(승인 2명, test·build 통과)이 모두 채워지면 GitHub가 merge commit으로 머지한다.
# 멈추고 싶으면 PR 화면에서 "Disable auto-merge"를 누르거나 초안(draft)으로 둔다.
# 저장소 설정 Settings → General → "Allow auto-merge"가 켜져 있어야 한다.
name: dev auto-merge

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    # 초안과 포크에서 온 PR에는 켜지 않는다.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 자동 머지 켜기
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
