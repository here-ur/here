# dev·main으로 가는 PR마다 테스트와 빌드를 돌린다.
# 룰셋의 필수 체크 이름은 아래 job 이름(test, build)과 같아야 한다.
name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 빌드만 확인하므로 공개 설정 자리에 가짜 값을 넣는다. 비밀 키는 쓰지 않는다.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
