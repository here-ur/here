# main으로 가는 PR은 이 저장소의 dev 브랜치에서 온 것만 통과한다.
# main 룰셋에서 "source-is-dev"를 필수 체크로 건다.
name: main source check

on:
  pull_request:
    branches: [main]
    # edited: PR의 대상 브랜치를 바꿨을 때도 다시 확인한다.
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  source-is-dev:
    name: source-is-dev
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: PR 출발 브랜치 확인
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" = "dev" ] && [ "$HEAD_REPO" = "$THIS_REPO" ]; then
            echo "OK: $HEAD_REPO:$HEAD_REF → main"
          else
            echo "::error::main에는 dev에서 온 PR만 병합할 수 있어요. (지금: $HEAD_REPO:$HEAD_REF)"
            echo "작업 브랜치는 dev로 PR을 보내고, dev → main PR로 운영에 반영하세요."
            exit 1
          fi
